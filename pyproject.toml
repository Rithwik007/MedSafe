[project]
name = "medsafe"
version = "0.1.0"
description = "Source-tracked medication safety decision-support demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "rapidfuzz>=3.14", "networkx>=3.2"]

[project.optional-dependencies]
# Starlette 1.3 TestClient now uses httpx2; using httpx emits a deprecation warning.
dev = ["pytest>=8", "httpx2>=2.13", "ruff>=0.3"]
ui = ["streamlit>=1.32", "requests>=2.31"]
ml = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.2", "joblib>=1.3", "pandas>=2.0"]
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
